<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="soft-glow-male" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtle-shadow-male" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="male-aura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="male-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="male-hair-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="male-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1ea" />
      <stop offset="100%" stop-color="#fed5c8" />
    </linearGradient>

    <linearGradient id="male-eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="male-clothes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Outer Celestial Ring -->
  <circle cx="120" cy="120" r="108" fill="none" stroke="url(#male-aura)" stroke-width="3" opacity="0.6" stroke-dasharray="12 6" filter="url(#soft-glow-male)" />
  <circle cx="120" cy="120" r="114" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />

  <!-- Floating Gentle Starlight Sparkles -->
  <g opacity="0.85">
    <circle cx="46" cy="54" r="3.5" fill="#bae6fd">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <path d="M 46 48 L 47.5 53 L 52 54 L 47.5 55 L 46 60 L 44.5 55 L 40 54 L 44.5 53 Z" fill="#ffffff" />

    <circle cx="194" cy="60" r="4" fill="#a5b4fc">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <path d="M 194 54 L 195.5 59 L 200 60 L 195.5 61 L 194 66 L 192.5 61 L 188 60 L 192.5 59 Z" fill="#ffffff" />

    <circle cx="192" cy="172" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="48" cy="168" r="2.5" fill="#818cf8">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Cozy Starlit Jacket / Hoodie -->
  <path d="M 72 195 C 72 168, 92 156, 120 156 C 148 156, 168 168, 168 195 L 178 225 C 178 225, 120 236, 62 225 Z" fill="url(#male-clothes)" filter="url(#subtle-shadow-male)" />
  
  <!-- Jacket Collar / Starlight Accent -->
  <path d="M 96 168 L 120 182 L 144 168 L 136 195 L 120 200 L 104 195 Z" fill="#1e1b4b" opacity="0.6" />
  <path d="M 100 168 L 120 180 L 140 168" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow-male)" />
  
  <!-- Glowing Cosmic Compass / Star Badge -->
  <g transform="translate(142, 198)">
    <circle cx="0" cy="0" r="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.2" />
    <polygon points="0,-4 1.2,-1 4,0 1.2,1 0,4 -1.2,1 -4,0 -1.2,-1" fill="#fde047" filter="url(#soft-glow-male)" />
  </g>

  <!-- Neck -->
  <path d="M 106 142 L 106 168 C 114 172, 126 172, 134 168 L 134 142 Z" fill="#fed5c8" />

  <!-- Back Hair Tufts -->
  <path d="M 64 95 C 55 118, 62 145, 78 155 C 74 142, 70 125, 74 105 Z" fill="url(#male-hair-shadow)" />
  <path d="M 176 95 C 185 118, 178 145, 162 155 C 166 142, 170 125, 166 105 Z" fill="url(#male-hair-shadow)" />

  <!-- Head / Face (Warm, soft rounded jaw) -->
  <path d="M 72 102 C 72 68, 90 52, 120 52 C 150 52, 168 68, 168 102 C 168 130, 146 154, 120 154 C 94 154, 72 130, 72 102 Z" fill="url(#male-skin)" filter="url(#subtle-shadow-male)" />

  <!-- Cute Ears with soft cyber studs -->
  <ellipse cx="69" cy="110" rx="6.5" ry="9.5" fill="#fecdc2" />
  <circle cx="68" cy="115" r="2.5" fill="#38bdf8" filter="url(#soft-glow-male)" />

  <ellipse cx="171" cy="110" rx="6.5" ry="9.5" fill="#fecdc2" />
  <circle cx="172" cy="115" r="2.5" fill="#38bdf8" filter="url(#soft-glow-male)" />

  <!-- Warm, Gentle Blushing Cheeks -->
  <ellipse cx="88" cy="120" rx="10" ry="5" fill="#f472b6" opacity="0.35" filter="url(#soft-glow-male)" />
  <ellipse cx="152" cy="120" rx="10" ry="5" fill="#f472b6" opacity="0.35" filter="url(#soft-glow-male)" />

  <!-- Kind, Compassionate, Sparkling Eyes -->
  <!-- Left Eye -->
  <g>
    <!-- Upper Eyelid Arc -->
    <path d="M 83 103 C 89 95, 102 96, 107 103" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Eye Sclera & Iris -->
    <ellipse cx="95" cy="110" rx="8.5" ry="10" fill="#ffffff" />
    <ellipse cx="95" cy="110" rx="7.5" ry="9" fill="url(#male-eye)" />
    <!-- Pupil -->
    <ellipse cx="95" cy="110" rx="4" ry="5" fill="#0f172a" />
    <!-- Sparkles / Catchlights -->
    <ellipse cx="92.5" cy="106" rx="2.8" ry="3.2" fill="#ffffff" />
    <circle cx="97.5" cy="113" r="1.6" fill="#ffffff" />
    <polygon points="95,115 96,113.5 97,115 96,116.5" fill="#67e8f9" />
  </g>

  <!-- Right Eye -->
  <g>
    <!-- Upper Eyelid Arc -->
    <path d="M 133 103 C 138 95, 151 96, 157 103" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Eye Sclera & Iris -->
    <ellipse cx="145" cy="110" rx="8.5" ry="10" fill="#ffffff" />
    <ellipse cx="145" cy="110" rx="7.5" ry="9" fill="url(#male-eye)" />
    <!-- Pupil -->
    <ellipse cx="145" cy="110" rx="4" ry="5" fill="#0f172a" />
    <!-- Sparkles / Catchlights -->
    <ellipse cx="142.5" cy="106" rx="2.8" ry="3.2" fill="#ffffff" />
    <circle cx="147.5" cy="113" r="1.6" fill="#ffffff" />
    <polygon points="145,115 146,113.5 147,115 146,116.5" fill="#67e8f9" />
  </g>

  <!-- Friendly, Gentle Eyebrows -->
  <path d="M 83 92 C 89 88, 98 89, 104 93" fill="none" stroke="#334155" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 136 93 C 142 89, 151 88, 157 92" fill="none" stroke="#334155" stroke-width="2.6" stroke-linecap="round" />

  <!-- Cute Nose -->
  <ellipse cx="120" cy="118" rx="1.8" ry="1.2" fill="#e2a799" />

  <!-- Heartwarming, Reassuring Smile -->
  <path d="M 112 128 Q 120 136 128 128" fill="none" stroke="#db2777" stroke-width="2.6" stroke-linecap="round" />

  <!-- Fluffy, Stylish Soft Cosmic Hair -->
  <!-- Top and sides hair layers -->
  <path d="M 64 96 C 60 55, 80 34, 120 34 C 158 34, 178 52, 176 96 C 172 82, 162 70, 148 70 C 138 70, 130 76, 124 76 C 118 76, 110 68, 96 68 C 82 68, 70 80, 64 96 Z" fill="url(#male-hair)" />

  <!-- Fluffy bangs overlapping forehead -->
  <path d="M 72 74 C 82 85, 94 92, 100 92 C 94 82, 88 74, 82 70 Z" fill="url(#male-hair)" />
  <path d="M 96 68 C 104 82, 114 90, 120 90 C 114 78, 110 70, 104 68 Z" fill="url(#male-hair)" />
  <path d="M 144 68 C 134 82, 124 90, 118 90 C 124 78, 130 70, 136 68 Z" fill="url(#male-hair)" />
  <path d="M 166 74 C 156 85, 144 92, 138 92 C 144 82, 150 74, 156 70 Z" fill="url(#male-hair)" />

  <!-- Subtle Cyan Hair Highlight Arc -->
  <path d="M 90 48 C 105 40, 135 40, 150 48" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
