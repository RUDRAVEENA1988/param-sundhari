<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.3" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="fem-aura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="fem-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="85%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="fem-hair-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <linearGradient id="fem-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0ea" />
      <stop offset="100%" stop-color="#fed7cc" />
    </linearGradient>

    <linearGradient id="fem-eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="fem-clothes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Outer Celestial Halo Ring -->
  <circle cx="120" cy="120" r="108" fill="none" stroke="url(#fem-aura)" stroke-width="3" opacity="0.6" stroke-dasharray="12 6" filter="url(#soft-glow)" />
  <circle cx="120" cy="120" r="114" fill="none" stroke="#f472b6" stroke-width="1.2" opacity="0.4" />

  <!-- Floating Gentle Starlight Sparkles -->
  <g opacity="0.85">
    <circle cx="45" cy="50" r="3.5" fill="#fbcfe8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <path d="M 45 44 L 46.5 49 L 51 50 L 46.5 51 L 45 56 L 43.5 51 L 39 50 L 43.5 49 Z" fill="#ffffff" />

    <circle cx="195" cy="65" r="4" fill="#67e8f9">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite" />
    </circle>
    <path d="M 195 59 L 196.5 64 L 201 65 L 196.5 66 L 195 71 L 193.5 66 L 189 65 L 193.5 64 Z" fill="#ffffff" />

    <circle cx="190" cy="175" r="3" fill="#e9d5ff">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="48" cy="170" r="2.5" fill="#f472b6">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Back Flowing Hair -->
  <path d="M 68 110 C 50 145, 52 195, 78 215 C 85 210, 88 190, 82 165 C 82 165, 100 185, 120 185 C 140 185, 158 165, 158 165 C 152 190, 155 210, 162 215 C 188 195, 190 145, 172 110 Z" fill="url(#fem-hair-shadow)" />
  <path d="M 64 110 C 46 150, 48 195, 76 218 C 70 185, 74 150, 80 125 Z" fill="url(#fem-hair)" opacity="0.9" />
  <path d="M 176 110 C 194 150, 192 195, 164 218 C 170 185, 166 150, 160 125 Z" fill="url(#fem-hair)" opacity="0.9" />

  <!-- Cozy Cosmic Collar / Sweater -->
  <path d="M 75 195 C 75 168, 95 158, 120 158 C 145 158, 165 168, 165 195 L 175 224 C 175 224, 120 236, 65 224 Z" fill="url(#fem-clothes)" filter="url(#subtle-shadow)" />
  
  <!-- Soft Collar Trim -->
  <path d="M 98 168 C 108 178, 132 178, 142 168 C 135 182, 105 182, 98 168 Z" fill="#ffffff" opacity="0.85" />
  
  <!-- Heart Locket / Starlight Charm -->
  <g transform="translate(120, 192)">
    <path d="M 0 -2 C -4 -7, -10 -3, -10 2 C -10 7, 0 13, 0 14 C 0 14, 10 7, 10 2 C 10 -3, 4 -7, 0 -2 Z" fill="#fde047" filter="url(#soft-glow)" />
    <circle cx="0" cy="5" r="2.5" fill="#ffffff" />
  </g>

  <!-- Neck -->
  <path d="M 108 145 L 108 170 C 114 174, 126 174, 132 170 L 132 145 Z" fill="#fed7cc" />

  <!-- Head / Face (Cute rounded shape) -->
  <path d="M 72 105 C 72 70, 90 52, 120 52 C 150 52, 168 70, 168 105 C 168 132, 148 156, 120 156 C 92 156, 72 132, 72 105 Z" fill="url(#fem-skin)" filter="url(#subtle-shadow)" />

  <!-- Ears with cute starlight earrings -->
  <ellipse cx="70" cy="112" rx="6.5" ry="9" fill="#fecdc2" />
  <circle cx="68" cy="118" r="3" fill="#fde047" filter="url(#soft-glow)" />

  <ellipse cx="170" cy="112" rx="6.5" ry="9" fill="#fecdc2" />
  <circle cx="172" cy="118" r="3" fill="#fde047" filter="url(#soft-glow)" />

  <!-- Adorable Rosy Blushing Cheeks -->
  <ellipse cx="88" cy="122" rx="11" ry="5.5" fill="#fb7185" opacity="0.45" filter="url(#soft-glow)" />
  <ellipse cx="152" cy="122" rx="11" ry="5.5" fill="#fb7185" opacity="0.45" filter="url(#soft-glow)" />
  <!-- Cute little sparkle on cheek -->
  <polygon points="86,122 87.5,120 89,122 87.5,124" fill="#ffffff" opacity="0.8" />
  <polygon points="152,122 153.5,120 155,122 153.5,124" fill="#ffffff" opacity="0.8" />

  <!-- Gorgeous Big Lovely Eyes -->
  <!-- Left Eye -->
  <g>
    <!-- Upper Soft Eyelash Arc -->
    <path d="M 82 104 C 88 95, 102 96, 106 104" fill="none" stroke="#3b1d54" stroke-width="3" stroke-linecap="round" />
    <path d="M 80 102 L 77 99" stroke="#3b1d54" stroke-width="2" stroke-linecap="round" />
    <path d="M 104 100 L 107 97" stroke="#3b1d54" stroke-width="1.8" stroke-linecap="round" />

    <!-- Eye Sclera & Iris -->
    <ellipse cx="94" cy="111" rx="9" ry="11" fill="#ffffff" />
    <ellipse cx="94" cy="111" rx="8" ry="10" fill="url(#fem-eye)" />
    <!-- Pupil -->
    <ellipse cx="94" cy="111" rx="4.5" ry="6" fill="#1e1035" />
    <!-- Sparkles / Catchlights -->
    <ellipse cx="91.5" cy="107" rx="3" ry="3.5" fill="#ffffff" />
    <circle cx="96.5" cy="114" r="1.8" fill="#ffffff" />
    <polygon points="94,116 95,114.5 96,116 95,117.5" fill="#67e8f9" />
  </g>

  <!-- Right Eye -->
  <g>
    <!-- Upper Soft Eyelash Arc -->
    <path d="M 134 104 C 138 95, 152 96, 158 104" fill="none" stroke="#3b1d54" stroke-width="3" stroke-linecap="round" />
    <path d="M 160 102 L 163 99" stroke="#3b1d54" stroke-width="2" stroke-linecap="round" />
    <path d="M 136 100 L 133 97" stroke="#3b1d54" stroke-width="1.8" stroke-linecap="round" />

    <!-- Eye Sclera & Iris -->
    <ellipse cx="146" cy="111" rx="9" ry="11" fill="#ffffff" />
    <ellipse cx="146" cy="111" rx="8" ry="10" fill="url(#fem-eye)" />
    <!-- Pupil -->
    <ellipse cx="146" cy="111" rx="4.5" ry="6" fill="#1e1035" />
    <!-- Sparkles / Catchlights -->
    <ellipse cx="143.5" cy="107" rx="3" ry="3.5" fill="#ffffff" />
    <circle cx="148.5" cy="114" r="1.8" fill="#ffffff" />
    <polygon points="146,116 147,114.5 148,116 147,117.5" fill="#67e8f9" />
  </g>

  <!-- Cute Gentle Eyebrows -->
  <path d="M 83 94 C 88 90, 98 91, 103 95" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
  <path d="M 137 95 C 142 91, 152 90, 157 94" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />

  <!-- Tiny Cute Nose -->
  <ellipse cx="120" cy="120" rx="1.8" ry="1.2" fill="#f472b6" opacity="0.7" />

  <!-- Sweet Loving Smile -->
  <path d="M 112 130 Q 120 138 128 130" fill="none" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round" />
  <!-- Small open smile depth -->
  <path d="M 113 131 Q 120 137 127 131 Z" fill="#f43f5e" opacity="0.3" />

  <!-- Front Beautiful Hair (Cute bangs & silky side strands) -->
  <path d="M 68 100 C 65 60, 85 40, 120 40 C 155 40, 175 60, 172 100 C 166 85, 155 72, 138 72 C 128 72, 122 80, 118 80 C 114 80, 108 72, 98 72 C 82 72, 72 86, 68 100 Z" fill="url(#fem-hair)" />

  <!-- Front Bang Locks -->
  <path d="M 82 76 C 88 88, 92 100, 88 108 C 84 98, 86 85, 82 76 Z" fill="url(#fem-hair-shadow)" opacity="0.4" />
  <path d="M 94 72 C 102 85, 108 96, 114 96 C 110 88, 106 78, 98 72 Z" fill="url(#fem-hair)" />
  <path d="M 146 72 C 138 85, 132 96, 126 96 C 130 88, 134 78, 142 72 Z" fill="url(#fem-hair)" />
  <path d="M 158 76 C 152 88, 148 100, 152 108 C 156 98, 154 85, 158 76 Z" fill="url(#fem-hair-shadow)" opacity="0.4" />

  <!-- Starlight Hairpin / Cosmic Butterfly Accessory -->
  <g transform="translate(78, 66)">
    <!-- Star hairpin -->
    <polygon points="0,-9 2.5,-2.5 9,0 2.5,2.5 0,9 -2.5,2.5 -9,0 -2.5,-2.5" fill="#fde047" filter="url(#soft-glow)" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    <circle cx="8" cy="-6" r="1.8" fill="#38bdf8" />
  </g>
</svg>
