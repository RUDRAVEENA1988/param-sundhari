<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background glow filter -->
    <filter id="glow-neutral" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-shadow-neu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.5" />
    </filter>
    <!-- Gradients -->
    <linearGradient id="orb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
    <radialGradient id="inner-core" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="80%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0c0717" />
    </radialGradient>
  </defs>

  <!-- Ambient Pulsing Outer Ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#ring-grad)" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" filter="url(#glow-neutral)">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite" />
  </circle>

  <!-- Twinkling floating satellites / stardust -->
  <circle cx="35" cy="65" r="3" fill="#67e8f9" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="165" cy="70" r="2.5" fill="#f472b6" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="145" cy="155" r="3" fill="#a855f7" opacity="0.8">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="55" cy="145" r="2.5" fill="#38bdf8" opacity="0.7">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.2s" repeatCount="indefinite" />
  </circle>

  <!-- Back Half of Planetary Ring -->
  <g transform="rotate(-25 100 100)">
    <ellipse cx="100" cy="100" rx="84" ry="24" fill="none" stroke="url(#ring-grad)" stroke-width="4" opacity="0.5" stroke-dasharray="20 4" />
  </g>

  <!-- Cute Celestial Floating Wings / Ears -->
  <path d="M 52 75 C 30 70, 30 95, 54 98 Z" fill="url(#ring-grad)" opacity="0.85" filter="url(#glow-neutral)" />
  <path d="M 148 75 C 170 70, 170 95, 146 98 Z" fill="url(#ring-grad)" opacity="0.85" filter="url(#glow-neutral)" />

  <!-- Main Floating Cosmic Orb Body -->
  <circle cx="100" cy="100" r="50" fill="url(#inner-core)" stroke="url(#orb-grad)" stroke-width="2.5" filter="url(#soft-shadow-neu)" />

  <!-- Front Half of Planetary Ring (Over Body) -->
  <g transform="rotate(-25 100 100)">
    <path d="M 16 100 A 84 24 0 0 0 184 100" fill="none" stroke="url(#ring-grad)" stroke-width="5" stroke-linecap="round" filter="url(#glow-neutral)" />
  </g>

  <!-- Soft Rosy Cheeks -->
  <circle cx="78" cy="108" r="6" fill="#f472b6" opacity="0.5" filter="url(#glow-neutral)" />
  <circle cx="122" cy="108" r="6" fill="#f472b6" opacity="0.5" filter="url(#glow-neutral)" />

  <!-- Expressive Friendly Cyber Eyes -->
  <!-- Left Eye -->
  <ellipse cx="82" cy="94" rx="6" ry="7.5" fill="#38bdf8" filter="url(#glow-neutral)" />
  <ellipse cx="82" cy="94" rx="4.5" ry="6" fill="#ffffff" />
  <circle cx="84" cy="92" r="2" fill="#0c0717" />
  <circle cx="85" cy="91" r="0.9" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="118" cy="94" rx="6" ry="7.5" fill="#38bdf8" filter="url(#glow-neutral)" />
  <ellipse cx="118" cy="94" rx="4.5" ry="6" fill="#ffffff" />
  <circle cx="120" cy="92" r="2" fill="#0c0717" />
  <circle cx="121" cy="91" r="0.9" fill="#ffffff" />

  <!-- Happy Heartwarming Smile -->
  <path d="M 92 108 Q 100 117 108 108" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Crown Spark / Celestial Star on Head -->
  <g transform="translate(100, 42)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#fde047" filter="url(#glow-neutral)">
      <animateTransform attributeName="transform" type="scale" values="0.85;1.15;0.85" dur="2s" repeatCount="indefinite" />
    </polygon>
  </g>
</svg>
